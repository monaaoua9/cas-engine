[package]
name = "cas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.cas]
path = ".."

[workspace]

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false

[[bin]]
name = "segment_scan"
path = "fuzz_targets/segment_scan.rs"
test = false
doc = false

[[bin]]
name = "chunker"
path = "fuzz_targets/chunker.rs"
test = false
doc = false

[[bin]]
name = "tree_decode"
path = "fuzz_targets/tree_decode.rs"
test = false
doc = false

[[bin]]
name = "format_decode"
path = "fuzz_targets/format_decode.rs"
test = false
doc = false

[[bin]]
name = "wire_frame"
path = "fuzz_targets/wire_frame.rs"
test = false
doc = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false

[[bin]]
name = "tar_import"
path = "fuzz_targets/tar_import.rs"
test = false
doc = false

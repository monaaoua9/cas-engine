[package]
name = "cas"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Content-addressed, immutable, deduplicating object store with Rabin chunking, BLAKE3 and Merkle integrity proofs"
license = "MIT"
readme = "README.md"
keywords = ["content-addressed", "storage", "merkle", "blake3", "deduplication"]
categories = ["filesystem", "data-structures"]

[dependencies]
argon2 = "0.6.0"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
getrandom = "0.4"
lz4_flex = "0.14.0"
memmap2 = "0.9.12"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
# lets tests kill the process at named points inside put/rm/gc
failpoints = []

[[bench]]
name = "throughput"
harness = false

[[test]]
name = "crash_failpoints"
required-features = ["failpoints"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
